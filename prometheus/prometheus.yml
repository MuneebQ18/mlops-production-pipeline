global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'mlops-ec2-inference-service'
    static_configs:
      - targets: ['98.91.18.78:8000']

  - job_name: 'metrics-exporter'
    static_configs:
      - targets: ['metrics-exporter:8001']